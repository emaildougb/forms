<style>

  /* 1.4 header matched to Derek's Open Shifts app (Doug's rule for every NCEMS app): white bar, system font, NCEMS black + app name green, a thin line, North Country EMS */

<header>
  <img src="logo.png" alt="" onclick="go('home')" style="cursor:pointer">
  <div class="t" onclick="go('home')" style="cursor:pointer"><h1>NCEMS <span class="os-g">Forms</span></h1><div class="sub"><span>North Country EMS</span><p id="hdr-sub">CG Staff only</p></div></div>
  <button class="icon-btn" onclick="go('home')" title="Forms home" aria-label="Forms home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
  <button class="icon-btn" onclick="go('search')" title="Search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></button>

<script>
/* =====================================================================
   NCEMS Forms  (forms.northcountryems.org)
   Write ups, quick notes and SOG drafts for the CG Staff. Makes a Word
   file in the agency's format and files it in the Personnel Files
   folder on the CG Staff SharePoint site. Search by employee.
   ===================================================================== */
const VERSION = '1.4';

const CONFIG = {
  clientId:  'f758d1fe-91b7-4bd5-92a9-1324d8bf0826',   // 1.3: NCEMS Command Staff Entra app (only the 7 CG Staff are assigned)
  tenantId:  '153dc089-095e-4a20-8d10-39321a0aca09',
  devPilot: false,   // 1.4: the development record shows in demo mode only until the Chief OKs a pilot
  siteHost:  'northcountryemsorg.sharepoint.com',
  sitePath:  '/sites/BattalionChiefLocal',             // CG Staff site
  refFolder: 'Forms Reference',                        // policy-manual.md and cba.md live here
  personnelFolder: 'Personnel Files',                  // one folder per employee: "Last, First"
  sogFolder: 'SOG Drafts',
  spDocs:      'https://northcountryemsorg.sharepoint.com/sites/BattalionChiefLocal/Shared%20Documents',
  spPersonnel: 'https://northcountryemsorg.sharepoint.com/sites/BattalionChiefLocal/Shared%20Documents/Personnel%20Files',

function addDays(iso, n) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return ''; const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n)); return d.toISOString().slice(0, 10); }

/* ---------------- auth (same pattern as CG Staff) ---------------- */
function redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function loginHint() { try { return localStorage.getItem('ncems_login_hint') || ''; } catch (e) { return ''; } }
function saveLoginHint(u) { try { if (u) localStorage.setItem('ncems_login_hint', String(u).toLowerCase()); } catch (e) {} }
async function initAuth() {
  if (typeof msal === 'undefined') throw new Error('Could not load Microsoft sign-in. Check the connection and reopen.');
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/' + CONFIG.tenantId, redirectUri: redirectUri(), navigateToLoginRequestUrl: false },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
  });
  await msalApp.initialize();
  const res = await msalApp.handleRedirectPromise();
  account = (res && res.account) || msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || null;
  const urlHint = new URLSearchParams(location.search).get('login_hint');
  if (urlHint) { saveLoginHint(urlHint); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (!account && loginHint()) {
    try { const r = await msalApp.ssoSilent({ scopes: SCOPES, loginHint: loginHint() }); if (r && r.account) account = r.account; }
    catch (e) {
      let hopped = false; try { hopped = sessionStorage.getItem('ncems_sso_hop') === '1'; sessionStorage.setItem('ncems_sso_hop', '1'); } catch (er) {}
      if (urlHint && !hopped) { await msalApp.loginRedirect({ scopes: SCOPES, loginHint: loginHint() }); return; }
    }
  }
  if (account) { msalApp.setActiveAccount(account); saveLoginHint(account.username); try { sessionStorage.removeItem('ncems_sso_hop'); } catch (e) {} }
}
function signIn() {
  $('signin-err').classList.remove('show');
  msalApp.loginRedirect(loginHint() ? { scopes: SCOPES, loginHint: loginHint() } : { scopes: SCOPES, prompt: 'select_account' })
    .catch(e => { const b = $('signin-err'); b.textContent = (e && (e.errorMessage || e.message)) || String(e); b.classList.add('show'); });
}
function signOut() { if (DEMO) { location.href = location.pathname; return; } try { localStorage.removeItem('ncems_login_hint'); } catch (e) {} msalApp.logoutRedirect({ account, postLogoutRedirectUri: redirectUri() }); }
async function getToken() {
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required/.test(e.errorCode || '')) { await msalApp.acquireTokenRedirect({ scopes: SCOPES, account }); return new Promise(() => {}); }
    throw e;
  }
}

/* ---------------- Graph ---------------- */
async function graphRaw(path, opts, tries) {
  opts = opts || {}; tries = tries || 0;
  const url = path.startsWith('http') ? path : GRAPH + path;
  const headers = Object.assign({ Authorization: 'Bearer ' + await getToken() }, opts.headers || {});
  let body = opts.body;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.json); }
  let res;
  try { res = await fetch(url, { method: opts.method || 'GET', headers, body }); }
  catch (e) { const err = new Error('No connection. Check signal and try again.'); err.status = 0; throw err; }
  if ((res.status === 429 || res.status === 503) && tries < 3) { await sleep(Math.min(10, Number(res.headers.get('Retry-After')) || 2 ** tries) * 1000); return graphRaw(path, opts, tries + 1); }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
    if (res.status === 403) msg = 'No permission for that folder. (' + msg + ')';
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return res;
}
async function graph(path, opts) { const r = await graphRaw(path, opts); if (r.status === 204) return null; const ct = r.headers.get('content-type') || ''; return ct.includes('json') ? r.json() : null; }
async function getDrive() {
  if (driveId) return driveId;
  const s = await graph('/sites/' + CONFIG.siteHost + ':' + CONFIG.sitePath + '?$select=id'); siteId = s.id;
  const d = await graph('/sites/' + siteId + '/drive?$select=id'); driveId = d.id; return driveId;
}
function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
async function uploadFile(folderPath, name, blob) {
  const d = await getDrive();
  return graph('/drives/' + d + '/root:/' + encPath(folderPath + '/' + name) + ':/content?@microsoft.graph.conflictBehavior=rename', { method: 'PUT', body: blob, headers: { 'Content-Type': 'application/octet-stream' } });
}
async function listFolder(folderPath) {
  const d = await getDrive();
  try { const j = await graph('/drives/' + d + '/root:/' + encPath(folderPath) + ':/children?$top=999&$select=id,name,webUrl,file,folder,size,lastModifiedDateTime,createdBy'); return j.value || []; }
  catch (e) { if (e.status === 404) return []; throw e; }
}
async function readText(itemOrPath) {
  const d = await getDrive();
  const p = itemOrPath.id ? '/drives/' + d + '/items/' + itemOrPath.id + '/content' : '/drives/' + d + '/root:/' + encPath(itemOrPath) + ':/content';
  const r = await graphRaw(p); return r.text();
}

/* ---------------- review (built in checks, no AI) ---------------- */
function textOf(d) { return JSON.stringify(d); }
function checks() {
  const d = doc, out = [];
  const ok = t => out.push(['ok', t]), warn = t => out.push(['warn', t]), bad = t => out.push(['bad', t]);
  const blank = a => !a || !a.length || a.every(x => !String(Array.isArray(x) ? x.join('') : (typeof x === 'object' ? Object.values(x).join('') : x)).trim());
  const strs = []; (function walk(o, k) { if (typeof o === 'string') { if (!/^_auto_/.test(k || '')) strs.push(o); } else if (o && typeof o === 'object') Object.keys(o).forEach(kk => walk(o[kk], Array.isArray(o) ? k : kk)); })(d, '');
  const ph = strs.join('\n').match(/\[[^\]\n]{2,60}\]/g);
  if (ph && !(d.type === 'sog' && ph.every(p => p === '[TBD]'))) bad('Still has placeholders to fill in: ' + [...new Set(ph)].slice(0, 4).join(', '));
  else if (ph) warn('Some header fields still say [TBD]. Fine for a draft.');
  if (d.type === 'sog') {
    d.purpose ? ok('Purpose filled in.') : bad('1.0 Purpose is empty.');
    d.scope ? ok('Scope filled in.') : warn('2.0 Scope is empty. Say what it covers and what it does not.');
    blank(d.sections) ? warn('No topic sections yet (3.0 on).') : ok(d.sections.length + ' topic section(s).');
    blank(d.refs) ? warn('No references. Every rule that comes from policy or the CBA should be cited.') : ok(d.refs.length + ' reference(s).');
    if (/[\u2014\u2013]/.test(textOf(d))) warn('There is a long dash in the text. The SOG style says rewrite without dashes.');
    return out;
  }
  d.employee ? ok('Employee: ' + d.employee + (d.position ? ', ' + d.position : '')) : bad('No employee name.');
  if (d.type !== 'quick' && !d.position) warn('No position for the employee (it goes on the TO line and the signature line).');
  if (d.type === 'quick') { d.note || d.title ? ok('Note has text.') : bad('The note is empty.'); return out; }
  if (d.type === 'coach') { blank(d.topics) ? bad('No topics yet.') : ok(d.topics.length + ' topic(s).'); return out; }
  if (d.type === 'verbal' || d.type === 'written') {
    blank(d.concerns) ? bad('No concerns listed.') : ok(d.concerns.length + ' concern(s).');
    const noDate = d.concerns.filter(c => c && !/\d{1,2}\/\d{1,2}|\d{4}|january|february|march|april|may|june|july|august|september|october|november|december/i.test(c));
    if (noDate.length) warn(noDate.length + ' concern(s) have no date. Dates make the record stronger.');
    (d.policies.length || d.extraPolicies.some(p => p.on)) ? ok('Policy cited.') : bad('No violated policy checked.');
    blank(d.expect) ? bad('No expectations listed.') : (d.expect.some(e => e.what && !e.when) ? warn('Some expectations have no deadline.') : ok('Every expectation has a deadline.'));
    if (blank(d.timeline)) warn('No prior steps listed. If there was earlier coaching or reminders, add them.');
  }
  if (isUnit() && d.type !== 'coach') warn('Bargaining unit member (IAFF Local 452): offer a union rep for the meeting (Weingarten, Policy 1053). They have 30 calendar days to grieve (CBA Article 14). Confirm they were given the policy you cite (CBA Article 6.1).');
  if (d.type === 'cap') {
    const det = d.mode === 'Detailed';
    if (det) {
      d.background || !blank(d.findings) ? ok('Problem described (background and findings).') : bad('Policy 1053.5: list the deficiencies (background or findings).');
      blank(d.actions) ? bad('Policy 1053.5: no corrective actions (goals and objectives).') : ok(d.actions.length + ' corrective action(s).');
      d.actions.some(a => a.what && (!a.when || !a.measure)) ? warn('Some actions are missing a deadline or a measure of success.') : null;
    } else {
      d.wrong ? ok('What went wrong is filled in.') : bad('Policy 1053.5: describe the problem (What went wrong).');
      blank(d.youDo) ? bad('Policy 1053.5: no action steps for the employee.') : ok(d.youDo.length + ' action step(s).');
      blank(d.checkins) ? warn('No check ins listed. 1053.5 asks for monitoring and how often.') : ok('Check ins listed.');
    }
    planChecks().length ? ok('Monitoring timeline: ' + planChecks().join(', ') + ' days.') : bad('Policy 1053.5: no check in schedule.');
    d.consequence ? ok('Consequences stated.') : bad('Policy 1053.5: state what happens if the plan is not met.');
    ok('Fire Chief approval line is on the signature block (1053.5: the Chief approves every CAP before it starts).');
    warn('Reminder: 1053.5 prefers the CAP at the time of discipline, and no later than 7 calendar days after.');
  }
  return out;
}
function reviewHtml() {
  const T = TYPES[doc.type], isQuick = doc.type === 'quick', isSog = doc.type === 'sog';
  let h = '<div class="card"><h3>Review</h3><ul class="check-list">' + checks().map(c => '<li class="' + c[0] + '">' + (c[0] === 'ok' ? '&#10003;' : c[0] === 'warn' ? '!' : '&#10007;') + ' <span>' + esc(c[1]) + '</span></li>').join('') + '</ul>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start"><button class="btn ghost small" onclick="copyForClaude()">Copy for Claude</button><div><button class="ai-btn" style="padding:7px 11px;font-size:12px" onclick="aiAssist()">&#10024; AI review</button><div class="ai-note">Not connected to AI yet</div></div></div></div>';
  h += '<div class="card"><h3>Preview</h3><div class="preview">' + previewHtml() + '</div></div>';

      : (canPersonnel() ? '<label class="ck"><input type="checkbox" ' + (doc.save ? 'checked' : '') + ' onchange="doc.save=this.checked"><div><b>File it in ' + esc(doc.employee || 'the employee') + '\'s personnel folder</b><em>' + esc(CONFIG.personnelFolder + '/' + folderName(doc.employee || 'First Last')) + '</em></div></label>' : '<div class="note">Your account does not file into personnel folders. Download the file and give it to a chief.</div>')) +

  return h;

/* =====================================================================
   Document model: one list of blocks used for the preview, the plain
   text copy, and the Word file.
   ===================================================================== */
function paras(text) {
  const out = []; let bul = [];
  const flush = () => { if (bul.length) { out.push({ t: 'bul', items: bul }); bul = []; } };
  String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
    const b = /^\s*[-*\u2022]\s+(.*)$/.exec(line);
    if (b) bul.push(b[1]);
    else if (line.trim()) { flush(); out.push({ t: 'p', text: line.trim() }); }
    else flush();
  });
  flush(); return out;
}
function clean(a) { return (a || []).filter(x => String(Array.isArray(x) ? x.join('') : (typeof x === 'object' ? Object.values(x).join('') : x)).trim()); }
function empLine() { return doc.employee + (doc.position ? ', ' + doc.position : '') + (doc.nonEmp ? ' (non-employee)' : ''); }
function fromLine() { return doc.fromName + (doc.fromTitle ? ', ' + doc.fromTitle : ''); }
function selectedPolicies(k) { return (doc[k] || []).map(libItem).filter(Boolean).concat(k === 'policies' ? doc.extraPolicies.filter(p => p.on) : []); }
function sigBlock(extraChief) {
  const lines = [{ name: empLine() }, { name: fromLine() }];
  if (extraChief) lines.push({ name: CONFIG.chief[0] + ', ' + CONFIG.chief[1] + (doc.type === 'cap' ? ', Approval Prior to Implementation' : '') });
  return { t: 'sig', lines };
}
function blocks() {
  const d = doc, B = [];
  const H = t => B.push({ t: 'h', text: t });
  const P = t => paras(t).forEach(b => B.push(b));
  if (d.type === 'sog') return sogBlocks();
  B.push({ t: 'memo', rows: [['TO:', empLine()], ['FROM:', fromLine()], ['DATE:', isoToUS(d.date)], ['SUBJECT:', d.subject || TYPES[d.type].name]] });
  if (d.type === 'coach') {
    P(d.intro);
    clean(d.topics).forEach(tp => { B.push({ t: 'h2', text: tp.h }); P(tp.t); });
    const tasks = clean(d.tasks); if (tasks.length) { H('Follow up:'); B.push({ t: 'bul', items: tasks.map(x => x.what + (x.when ? '. Due ' + x.when + '.' : '')) }); }
    P(d.closing);
    if (d.sigLines) B.push(sigBlock(false));
    return B;
  }
  if (d.type === 'verbal' || d.type === 'written') {
    P(d.opening);
    if (clean(d.concerns).length) { H('Summary of Concerns:'); P(d.concernsIntro); B.push({ t: 'bul', items: clean(d.concerns) }); }
    if (clean(d.pattern).length) { H('Pattern of Behavior:'); B.push({ t: 'bul', items: clean(d.pattern) }); }
    const tl = clean(d.timeline); if (tl.length) { H('Prior Steps:'); tl.forEach(x => B.push({ t: 'p', text: 'On ' + (/^\d{4}-/.test(x[0]) ? isoToUS(x[0]) : x[0]) + ', ' + x[1].replace(/^([A-Z])(?=[a-z])/, c => c.toLowerCase()) })); }

    const full = lev(k, d); let hits = 0;
    words.forEach(w => { if (w.length >= 3 && parts.some(p => p.startsWith(w.slice(0, 3)) || lev(w, p) <= 2)) hits++; });
    const sc = full - 4 * hits;

  openOv('<div class="dev"><h2>Ask a partner about ' + esc(displayName(folder)) + '</h2><p class="dev-sub">Two minutes, confidential. Only CG Staff see the answers, never who wrote them.</p><ol class="dev-qs"><li>What do they do that makes the crew better?</li><li>One thing that would make them even better to work with?</li></ol><p class="dev-sub">The real version picks the partners they ran with this quarter from the schedule.</p><div class="dev-acts"><button class="dv-btn" onclick="closeOv()">Cancel</button><button class="dv-btn main" onclick="devAdd(' + devQ(folder) + ',{d:todayISO(),k:\'partner\',by:\'Partner (confidential)\',title:\'Partner feedback\',body:\'(Sample answer from a partner.)\'})">Send (demo)</button></div></div>');
}
function devReview(folder) {
  const R = devRec(folder), E = R.entries.slice().sort((a, b) => a.d.localeCompare(b.d)), name = displayName(folder);
  const pick = k => E.filter(e => e.k === k), cite = e => '<a class="cite" title="' + esc(e.body || e.title) + '">' + esc(DEV_KINDS[e.k].name + ' ' + isoToUS(e.d).replace(/\/\d{4}$/, '')) + '</a>';
  const kud = pick('kudos'), coach = pick('coach'), ci = pick('checkin'), self = pick('self'), partner = pick('partner'), ev = pick('evidence');
  const line = (txt, src) => '<p>' + txt + (src.length ? ' <span class="from">From: ' + src.map(cite).join(', ') + '</span>' : '') + '</p>';
  openOv('<div class="dev wide"><h2>Yearly review draft, ' + esc(name) + '</h2><p class="dev-sub">Drafted from ' + E.length + ' entries on the timeline. Every line shows where it came from. The BC edits it, adds the conversation, and it prints on the agency evaluation form so Policy 1001 is still met.</p>' +
    '<div class="dev-q"><h3>Would I want this person on my crew for a bad call?</h3>' + line('Yes. ' + (kud.length ? esc(kud.at(-1).title) + ' shows how they run a hard call.' : '') + (partner.length ? ' Partners describe them as calm on scene and good with families.' : ''), kud.concat(partner)) + '</div>' +
    '<div class="dev-q"><h3>What is their real strength?</h3>' + line('Steady clinical work under pressure, and the crew trusts them.' + (ev.length ? ' Protocol review and rig check records back that up.' : ''), kud.concat(ev)) + '</div>' +
    '<div class="dev-q"><h3>What one thing would make them better?</h3>' + line(coach.length ? 'Charting on long transports. It came up in coaching and again at the Q4 check in; the plan is to start the narrative on the return trip.' : 'Not set yet.', coach.concat(ci.slice(-1))) + '</div>' +
    '<div class="dev-q"><h3>Ready for the next step?</h3>' + line(R.ladder.length ? esc(R.next) + ': ' + R.ladder.filter(x => x.done).length + ' of ' + R.ladder.length + ' done. Still to do: ' + R.ladder.filter(x => !x.done).map(x => esc(x.t)).join('; ') + '.' : 'Next step not set yet.', self) + '</div>' +
    '<div class="dev-q"><h3>Goals for next year</h3><ul>' + (R.goals.length ? R.goals.map(g => '<li>' + esc(g.t) + ' <span class="from">(' + esc(g.status) + ')</span></li>').join('') : '<li>Set at the first check in</li>') + '</ul></div>' +
    '<div class="dev-acts"><button class="dv-btn" onclick="closeOv()">Close</button><button class="dv-btn main" onclick="toast(\'In the real version this fills the evaluation form and files it in their folder.\')">Fill the evaluation form</button></div></div>');
}

function newFor(type, name) { doc = freshDoc(type); doc.employee = name; step = 0; route = 'form'; pushNav(); window.scrollTo(0, 0); render(); }
function pickWriteup(name) { openOv('<h2>Write up for ' + esc(name) + '</h2><div class="tiles">' + ['coach', 'verbal', 'written', 'cap'].map(t => tile(t, "closeOv();newFor('" + t + "'," + esc(JSON.stringify(name)).replace(/"/g, '&quot;') + ")")).join('') + '</div><br><button class="btn ghost" onclick="closeOv()">Cancel</button>'); }
function uploadOld(folder) {
  openOv('<h2>Upload an old file</h2><p>For write ups done before this app. It gets renamed so it sorts by date.</p>' +
    '<div class="f"><label>Kind</label><select class="inp" id="uo-type">' + ['coach', 'verbal', 'written', 'cap', 'quick', 'other'].map(k => '<option value="' + k + '">' + TYPES[k].name + '</option>').join('') + '</select></div>' +
    '<div class="f"><label>Date of the document</label><input class="inp" type="date" id="uo-date" value="' + todayISO() + '"></div>' +
    '<div class="f"><label>Short description (optional)</label><input class="inp" id="uo-desc" placeholder="PEAC and charting"></div>' +
    '<div class="f"><label>File</label><input class="inp" type="file" id="uo-file"></div>' +
    '<div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeOv()">Cancel</button><button class="btn" id="uo-go" onclick="doUploadOld(' + esc(JSON.stringify(folder)).replace(/"/g, '&quot;') + ')">Upload</button></div>');
}
async function doUploadOld(folder) {
  const f = $('uo-file').files[0]; if (!f) { toast('Pick a file.', true); return; }
  const ext = (f.name.split('.').pop() || 'docx').toLowerCase(), t = $('uo-type').value, desc = $('uo-desc').value.trim().replace(/[\\/:*?"<>|#%]/g, '');
  const name = ($('uo-date').value || todayISO()) + ' ' + TYPES[t].file + (desc ? ' (' + desc + ')' : '') + ' - ' + displayName(folder) + '.' + ext;
  $('uo-go').disabled = true;
  try { if (DEMO) DEMO_FILES.push({ person: folder, name, text: null }); else await uploadFile(CONFIG.personnelFolder + '/' + folder, name, f); closeOv(); toast('Uploaded.'); personCache = null; renderPerson($('main'), folder); }
  catch (e) { toast(e.message, true); $('uo-go').disabled = false; }
}

}
window.addEventListener('beforeunload', e => { if (doc && route === 'form' && !doc._done) { e.preventDefault(); e.returnValue = ''; } });
(async function start() {
  /* 1.2.1: let Microsoft sign in read its reply from the address bar BEFORE the back button code tidies the address (1.1 wiped it and looped back to sign in) */
  if (DEMO) { pushNav(true); $('hdr-sub').textContent = 'DEMO · nothing saves'; render(); return; }

  if (!account) { renderSignin(); return; }

    $('main').innerHTML = '<div class="center"><div class="center-card"><div class="center-head"><img src="logo.png" alt=""><h2>FORMS</h2></div><div class="center-body"><div class="only-box"><b>CG Staff only</b>You are signed in as ' + esc(meEmail()) + '. This is for the CG Staff. Your crew apps are on the NCEMS Hub.<a href="' + CONFIG.hubUrl + '">Open the NCEMS Hub</a></div><a class="small-link" href="#" onclick="signOut();return false">Sign out</a></div></div></div>';
    return;
  }
  $('hdr-sub').textContent = signer().name + (signer().title ? ', ' + signer().title : '');
  pushNav(true); render();
  if (canPersonnel()) loadPeople().catch(() => {});
})();
